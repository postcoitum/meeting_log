<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>회의록</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button id="toggle-sidebar" class="icon-btn" aria-label="사이드바 토글" title="사이드바 접기/펼치기">
      <svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><line x1="9" y1="4.5" x2="9" y2="19.5"/></svg>
    </button>
    <span class="app-title">회의록</span>
    <span id="progress" class="progress"></span>
    <button id="record" class="rec-btn" aria-label="녹음 시작/종료" title="마이크 녹음">
      <span class="rec-dot"></span><span id="rec-label">녹음</span><span id="rec-time"></span>
    </button>
    <span class="opacity-ctl">
      <label for="opacity">투명도</label>
      <input id="opacity" type="range" min="35" max="95" value="62" step="1">
    </span>
  </header>

  <main class="layout" id="layout">
    <aside id="sidebar" class="pane sidebar">
      <div class="pane-head">
        <span>회의 목록</span>
        <span class="head-btns">
          <button id="edit-title" class="icon-btn sm" aria-label="선택한 회의 제목 수정" title="제목 수정">
            <svg viewBox="0 0 24 24"><path d="M4 20h4L18 10l-4-4L4 16v4z"/><path d="M13 7l4 4"/></svg>
          </button>
          <button id="delete-meeting" class="icon-btn sm" aria-label="선택한 회의 삭제" title="회의 삭제">
            <svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6 7l1 13h10l1-13"/></svg>
          </button>
        </span>
      </div>
      <input id="search" class="search" type="text" placeholder="회의 검색…">
      <div id="meeting-list" class="list"></div>
      <button id="new-meeting" class="new-btn">+ 새 회의 (파일)</button>
    </aside>

    <section class="pane summary">
      <div class="pane-head">
        <span>회의 요약</span>
        <span class="head-btns">
          <button id="regen-summary" class="icon-btn sm" aria-label="요약 다시 생성" title="로컬 AI로 요약 다시 생성">
            <svg viewBox="0 0 24 24"><path d="M4 4v5h5"/><path d="M20 20v-5h-5"/><path d="M4 9a8 8 0 0 1 14.1-3"/><path d="M20 15a8 8 0 0 1-14.1 3"/></svg>
          </button>
          <button id="export-meeting" class="icon-btn sm" aria-label="마크다운으로 내보내기" title="내보내기 (.md)">
            <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M8 11l4 4 4-4"/><path d="M5 21h14"/></svg>
          </button>
        </span>
      </div>
      <textarea id="summary" class="editor" placeholder="로컬 AI 요약… (마크다운으로 직접 수정 가능)"></textarea>
      <div class="chat">
        <div id="chat-log" class="chat-log"></div>
        <div class="chat-row">
          <input id="chat-input" type="text" placeholder="회의 내용에 대해 질문하기…">
          <button id="chat-send" class="icon-btn sm" aria-label="질문 보내기" title="질문 보내기">
            <svg viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>
          </button>
        </div>
      </div>
    </section>

    <section class="right" id="right">
      <div id="memo-pane" class="pane memo">
        <div class="pane-head">
          <span>내 메모</span>
          <button id="toggle-memo" class="icon-btn sm" aria-label="메모 접기/펼치기" title="메모 접기">
            <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
          </button>
        </div>
        <textarea id="memo" class="editor" placeholder="여기에 메모… (마크다운)"></textarea>
      </div>
      <div class="pane transcript">
        <div class="pane-head"><span>스크립트 원본</span></div>
        <div id="stats" class="stats"></div>
        <pre id="transcript" class="script"></pre>
      </div>
    </section>
  </main>

  <script>
    // 브라우저 개발용: ?mock=1 로 열면 가짜 pywebview API를 먼저 로드
    if (new URLSearchParams(location.search).has("mock"))
      document.write('<script src="mock_api.js"><\/script>');
  </script>
  <script src="app.js"></script>
</body>
</html>
